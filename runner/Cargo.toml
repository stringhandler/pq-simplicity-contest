[package]
name = "pq-contest-runner"
version = "0.1.0"
edition = "2021"
description = "Tests pq-contest entries, and builds the leaderboard."
license = "MIT"
publish = false

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
lwk_wollet = "0.9"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The wallet's library: the same compile, satisfy, prune and pad a real spend uses.
# Pinned to a commit on the pq-shrincs branch. CI builds the signer from this same rev
# (.github/actions/build reads it here); docs/entry-format.md quotes it for local testing.
tx-manifest-lib = { git = "https://github.com/stringhandler/txmanifest-wallet", rev = "702a975e932cb0a937628e35792aff620bdaa09e" }
